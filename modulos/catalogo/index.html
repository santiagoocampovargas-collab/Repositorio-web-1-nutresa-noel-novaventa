<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Mock API · Nutresa</title>
    <link rel="stylesheet" href="catalogo.css">
</head>
<body>
    <header class="header">
        <h1>Laboratorio de Pruebas Mock API</h1>
    </header>

    <main class="contenedor">
        <section class="vitrina-seccion">
            <h2>Vitrina de Productos Nutresa</h2>
            
            <!-- Botón para desencadenar la petición a la Mock API -->
            <div class="acciones">
                <button id="btn-cargar" class="btn-principal">Cargar Productos desde Mock API</button>
            </div>

            <div id="vitrina-contenedor" class="vitrina-grid">
                <p>Haz clic en el botón de arriba para obtener los productos.</p>
            </div>
        </section>
    </main>

    <script src="index.js"></script>
</body>
</html>
